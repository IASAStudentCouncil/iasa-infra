; Supervisor застосунків (працює від користувача deploy).
; Конфіги програм кладе туди deploy-app: /home/deploy/supervisor/<app>.conf
[supervisord]
nodaemon=true
logfile=/home/deploy/logs/supervisord-apps.log
pidfile=/home/deploy/run/supervisord-apps.pid

[unix_http_server]
file=/home/deploy/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/deploy/run/supervisor.sock

[include]
files = /home/deploy/supervisor/*.conf
