# Шаблон CI/CD для репозиторію застосунку (сайт, бот).
# Скопіюйте у .github/workflows/deploy.yml свого репозиторію і додайте deploy/app.conf.
#
# Налаштування — на рівні РЕПОЗИТОРІЮ (Settings → Secrets and variables → Actions).
# Секрети й змінні організації на безкоштовному плані не доходять до приватних репо.
#   секрети:  DEPLOY_SSH_KEY      — приватний ключ github-actions (публічний — в iasa-infra/keys)
#             DEPLOY_KNOWN_HOSTS  — вивід `ssh-keyscan -p <порт> <хост>` для свого контейнера
#   змінні:   DEPLOY_HOST         — адреса сервера
#             DEPLOY_SSH_PORT     — SSH-порт свого контейнера (champ / portal / bots)
#   Telegram (необов'язково): secrets TG_BOT_TOKEN, TG_CHAT_ID, TG_THREAD_ID; variable PUBLIC_URL
#                         APP_NAME            — назва застосунку в контейнері (необов'язково, за замовчуванням — назва репо)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # поки сервер не налаштований (немає DEPLOY_HOST), деплой пропускається, а не падає
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_SSH_PORT }}
          APP: ${{ vars.APP_NAME || github.event.repository.name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP=$(echo "$APP" | tr '[:upper:]' '[:lower:]')
          # токен іде через stdin, щоб працювало і для приватних репозиторіїв
          echo "$TOKEN" | ssh -i ~/.ssh/id_deploy -p "$PORT" \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "deploy@$HOST" deploy-app "$APP" "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"

  notify:
    name: telegram
    needs: [deploy]
    if: always() && github.event_name != 'pull_request' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: send
        env:
          TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
          THREAD: ${{ secrets.TG_THREAD_ID }}
          CHECK: ${{ needs.deploy.result }}
          DEPLOY: ${{ needs.deploy.result }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          URL: ${{ vars.PUBLIC_URL }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || { echo "Telegram не налаштовано (TG_BOT_TOKEN / TG_CHAT_ID) — пропускаю"; exit 0; }
          esc() { sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g'; }
          if [ "$DEPLOY" = success ]; then icon="🟩"; status="задеплоєно"
          elif [ "$DEPLOY" = skipped ] && [ "$CHECK" = success ]; then icon="🟦"; status="перевірено, без деплою"
          else icon="🟥"; status="впало (check: $CHECK, deploy: $DEPLOY)"; fi
          text="$icon <b>$REPO</b> · $BRANCH — $status
          👤 $ACTOR
          💬 $(printf '%s' "$MSG" | head -n1 | esc)
          🔗 <a href=\"$RUN\">run</a>${URL:+ · <a href=\"$URL\">сайт</a>}"
          # прибрати відступ YAML з рядків повідомлення
          text=$(printf '%s\n' "$text" | sed 's/^ *//')
          args=()
          [ -n "$THREAD" ] && args+=(-d message_thread_id="$THREAD")
          resp=$(curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT" -d parse_mode=HTML -d disable_web_page_preview=true \
            "${args[@]}" --data-urlencode text="$text") || resp="curl failed"
          # Telegram відповідає помилкою в JSON (напр. хибний chat/thread id) — показуємо її як warning, а не валимо run
          if echo "$resp" | grep -q '"ok":true'; then echo "telegram: надіслано"; else echo "::warning::Telegram: $resp"; fi
