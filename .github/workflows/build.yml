# Telegram-сповіщення (необов'язково): secrets TG_BOT_TOKEN, TG_CHAT_ID, TG_THREAD_ID.
# Перевірка образу: збирає його, піднімає контейнер, заходить по SSH,
# деплоїть тестовий застосунок через deploy-app і перевіряє, що він відповідає.
name: Build & test base image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f base/Dockerfile -t iasa-base:test .

      - name: Start container
        run: |
          ssh-keygen -q -t ed25519 -N "" -f ci_key
          docker run -d --name iasa-test -p 2222:22 -p 8000:8000 \
            -e CONTAINER_NAME=ci -e AUTHORIZED_KEYS="$(cat ci_key.pub)" iasa-base:test
          for i in $(seq 1 20); do ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1 && break; sleep 1; done

      - name: Deploy sample app over SSH
        run: |
          mkdir sample && cd sample
          git init -q -b main
          mkdir deploy
          printf 'fastapi\nuvicorn\n' > requirements.txt
          printf 'from fastapi import FastAPI\napp = FastAPI()\n@app.get("/health")\ndef h():\n    return {"ok": True}\n' > main.py
          cat > deploy/app.conf <<'EOF'
          START='uvicorn main:app --host 0.0.0.0 --port $PORT'
          PORT=8000
          PERSIST="data"
          HEALTHCHECK_URL='http://127.0.0.1:$PORT/health'
          EOF
          git -c user.email=ci@x -c user.name=ci add -A
          git -c user.email=ci@x -c user.name=ci commit -qm sample
          docker cp . iasa-test:/tmp/sample
          docker exec iasa-test chown -R deploy:deploy /tmp/sample
          cd ..
          SSH="ssh -i ci_key -p 2222 -o StrictHostKeyChecking=no deploy@127.0.0.1"
          $SSH deploy-app sample file:///tmp/sample main < /dev/null
          curl -fsS http://127.0.0.1:8000/health
          $SSH apps status
          # повторний деплой не повинен ламати застосунок
          $SSH deploy-app sample file:///tmp/sample main < /dev/null
          $SSH apps releases sample

      - name: Root login and passwords are disabled
        run: |
          ! ssh -i ci_key -p 2222 -o StrictHostKeyChecking=no -o BatchMode=yes root@127.0.0.1 true
          docker exec iasa-test sshd -T | grep -E '^(passwordauthentication|permitrootlogin) no$' | wc -l | grep -q 2

      - name: Logs on failure
        if: failure()
        run: docker logs iasa-test || true; docker exec iasa-test cat /home/deploy/logs/sample.log || true

  notify:
    name: telegram
    needs: [test]
    if: always() && github.event_name != 'pull_request' && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: send
        env:
          TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
          THREAD: ${{ secrets.TG_THREAD_ID }}
          CHECK: ${{ needs.test.result }}
          DEPLOY: ${{ 'skipped' }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          URL: ${{ vars.PUBLIC_URL }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || { echo "Telegram не налаштовано (TG_BOT_TOKEN / TG_CHAT_ID) — пропускаю"; exit 0; }
          esc() { sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g'; }
          if [ "$DEPLOY" = success ]; then icon="🟩"; status="задеплоєно"
          elif [ "$DEPLOY" = skipped ] && [ "$CHECK" = success ]; then icon="🟦"; status="перевірено, без деплою"
          else icon="🟥"; status="впало (check: $CHECK, deploy: $DEPLOY)"; fi
          text="$icon <b>$REPO</b> · $BRANCH — $status
          👤 $ACTOR
          💬 $(printf '%s' "$MSG" | head -n1 | esc)
          🔗 <a href=\"$RUN\">run</a>${URL:+ · <a href=\"$URL\">сайт</a>}"
          # прибрати відступ YAML з рядків повідомлення
          text=$(printf '%s\n' "$text" | sed 's/^ *//')
          args=()
          [ -n "$THREAD" ] && args+=(-d message_thread_id="$THREAD")
          resp=$(curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT" -d parse_mode=HTML -d disable_web_page_preview=true \
            "${args[@]}" --data-urlencode text="$text") || resp="curl failed"
          # Telegram відповідає помилкою в JSON (напр. хибний chat/thread id) — показуємо її як warning, а не валимо run
          if echo "$resp" | grep -q '"ok":true'; then echo "telegram: надіслано"; else echo "::warning::Telegram: $resp"; fi
